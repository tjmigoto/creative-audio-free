<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eletrônica | Creative Audio Free</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans px-6 py-10">
  <h1 class="text-4xl font-bold text-center mb-8">🎧 Eletrônica</h1>
  <p class="text-center text-gray-400 mb-10">Batidas eletrônicas e sintetizadores para seus projetos criativos.</p>
  <div class="grid md:grid-cols-2 gap-6 max-w-4xl mx-auto">
    <div class="bg-gray-800 p-4 rounded-xl">
      <h2 class="text-xl font-semibold mb-2">Neon Pulse</h2>
      <audio controls class="w-full">
        <source src="musicas/eletronica-neon-pulse.mp3" type="audio/mpeg">
      </audio>
      <a href="musicas/eletronica-neon-pulse.mp3" download class="mt-2 inline-block text-blue-400 hover:underline">Baixar</a>
    </div>
    <div class="bg-gray-800 p-4 rounded-xl">
      <h2 class="text-xl font-semibold mb-2">Synth Galaxy</h2>
      <audio controls class="w-full">
        <source src="musicas/eletronica-synth-galaxy.mp3" type="audio/mpeg">
      </audio>
      <a href="musicas/eletronica-synth-galaxy.mp3" download class="mt-2 inline-block text-blue-400 hover:underline">Baixar</a>
    </div>
  </div>
</body>
</html>
